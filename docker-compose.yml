name: workspace-${APP_ENV:-sandbox}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.${APP_ENV:-sandbox}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    image: workspace-reservation-api:latest
    restart: unless-stopped
    env_file: .env.${APP_ENV:-sandbox}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

networks:
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
