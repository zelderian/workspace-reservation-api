name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Лінтер (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Тести (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  docker:
    name: Docker Compose (збірка та smoke-тест)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Підготовка env-файлів
        run: |
          cp .env.sandbox.example .env.sandbox
          cp .env.production.example .env.production
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=${KEY}|" .env.production

      - name: Sandbox - docker compose up --build
        run: docker compose up -d --build --wait

      - name: Sandbox - smoke-тест
        run: python3 scripts/smoke_test.py http://localhost:8000

      - name: Перевірка збереження даних (Data Persistence)
        run: |
          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from users"' \
            > before.txt
          docker compose down
          docker compose up -d --wait
          docker compose exec -T db sh -c \
            'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from users"' \
            > after.txt
          echo "До: $(cat before.txt), після: $(cat after.txt)"
          test "$(cat before.txt)" = "$(cat after.txt)"
          test "$(cat after.txt)" -ge 1

      - name: Production - окремий проєкт і окрема БД
        run: |
          docker compose --env-file .env.production up -d --build --wait
          python3 scripts/smoke_test.py http://localhost:8080 --expect-production
          docker volume ls | grep -E "workspace-(sandbox|production)_pgdata"

      - name: Розмір образу
        run: docker image ls workspace-reservation-api

      - name: Логи при помилці
        if: failure()
        run: |
          docker compose logs
          docker compose --env-file .env.production logs

      - name: Зупинка
        if: always()
        run: |
          docker compose down -v
          docker compose --env-file .env.production down -v
